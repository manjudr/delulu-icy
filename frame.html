<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#fff}
iframe{border:0;width:1440px;height:900px;display:block}</style>
<iframe id=f src="http://127.0.0.1:8777/index.html"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  const d=f.contentDocument,W=f.contentWindow;
  d.documentElement.style.scrollBehavior='auto';
  const s=d.getElementById('spectrum');
  const y = s ? s.offsetTop + (s.offsetHeight - W.innerHeight)*0.3
              : d.documentElement.scrollHeight;
  W.scrollTo(0,Math.max(0,y));
  const pin=setInterval(()=>W.scrollTo(0,Math.max(0,y)),30);
  setTimeout(()=>{
    clearInterval(pin); W.scrollTo(0,Math.max(0,y));
    const c=d.getElementById('curtain'); if(c) c.remove();
    document.title='READY';
  },3500);
};
</script>
